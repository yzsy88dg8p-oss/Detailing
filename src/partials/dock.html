<div class="dock" role="complementary" aria-label="Быстрая связь">
  <a class="dock__btn" href="{{ tg_url }}" target="_blank" rel="noopener" data-goal="click_tg">
    {{ i.tg }}<span class="dock__label">Telegram</span>
  </a>
  <a class="dock__btn" href="{{ wa_url }}" target="_blank" rel="noopener" data-goal="click_wa">
    {{ i.wa }}<span class="dock__label">WhatsApp</span>
  </a>
  <a class="dock__btn dock__btn--call" href="{{ tel_url }}" data-goal="click_phone">
    {{ i.phone }}<span class="dock__label">Позвонить</span>
  </a>
</div>
